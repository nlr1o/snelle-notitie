<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Snelle notitie</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #14161a; --panel: #1e2127; --line: #2f343d; --text: #eceef2; --muted: #9aa1ad;
    --accent: #3fb27f; --accent-text: #06150e; --danger: #e5484d;
  }
  body[data-dest="werk"] { --accent: #5b9dff; --accent-text: #04122b; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f8; --panel: #ffffff; --line: #d9dde3; --text: #16181d; --muted: #5d6470;
            --accent: #1f8f5f; --accent-text: #ffffff; }
    body[data-dest="werk"] { --accent: #2463d6; --accent-text: #ffffff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto; gap: 12px;
  }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; font-size: 20px; color: var(--muted); }
  .icon-btn:active { background: var(--panel); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel);
         border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { padding: 12px; border-radius: 10px; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }

  .banner { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent);
            border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
  .banner button { color: var(--accent); font-weight: 600; padding: 4px 0; }
  .banner.warn { border-left-color: #e0a100; }

  .editor { flex: 1; min-height: 160px; display: flex; flex-direction: column; background: var(--panel);
            border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .editor:focus-within { border-color: var(--accent); }
  textarea { flex: 1; width: 100%; resize: none; border: 0; outline: 0; background: transparent;
             color: var(--text); font: inherit; font-size: 17px; padding: 14px; }
  textarea::placeholder { color: var(--muted); }
  #interim { min-height: 0; padding: 0 14px; color: var(--muted); font-style: italic; font-size: 15px; }
  #interim:not(:empty) { padding-bottom: 10px; }

  .actions { display: grid; grid-template-columns: 64px 1fr; gap: 10px; }
  #mic { height: 64px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); font-size: 26px; }
  #mic[aria-pressed="true"] { background: var(--danger); border-color: var(--danger); color: #fff;
                               animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(229, 72, 77, .18); } }
  #send { height: 64px; border-radius: 16px; background: var(--accent); color: var(--accent-text);
          font-weight: 700; font-size: 17px; }
  #send:disabled { opacity: .5; }

  #status { min-height: 22px; font-size: 14px; color: var(--muted); text-align: center; }
  #status.ok { color: var(--accent); }
  #status.err { color: var(--danger); }

  dialog { width: min(92vw, 480px); border: 1px solid var(--line); border-radius: 16px;
           background: var(--panel); color: var(--text); padding: 18px; }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog h2 { margin: 0 0 12px; font-size: 17px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input, select { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
                  background: var(--bg); color: var(--text); font: inherit; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  .row button { flex: 1; padding: 12px; border-radius: 10px; font-weight: 600; border: 1px solid var(--line); }
  .row .primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  #account { font-size: 13px; color: var(--muted); margin-top: 14px; }
  #account button { color: var(--accent); font-weight: 600; }
</style>
</head>
<body data-dest="prive">
  <header>
    <h1>Snelle notitie</h1>
    <button class="icon-btn" id="openSettings" aria-label="Instellingen">⚙</button>
  </header>

  <div class="seg" role="group" aria-label="Bestemming">
    <button id="destPrive" aria-pressed="true">Privé</button>
    <button id="destWerk" aria-pressed="false">Werk</button>
  </div>

  <div class="banner warn" id="setupBanner" hidden></div>
  <div class="banner" id="loginBanner" hidden>
    Nog niet ingelogd bij Microsoft. <button id="login">Inloggen</button>
  </div>

  <div class="editor">
    <textarea id="text" placeholder="Typ of spreek je notitie in…" autocapitalize="sentences"></textarea>
    <div id="interim" aria-live="polite"></div>
  </div>

  <div id="status" role="status"></div>

  <div class="actions">
    <button id="mic" aria-pressed="false" aria-label="Spraak opnemen">🎤</button>
    <button id="send">Verzend naar Privé</button>
  </div>

  <dialog id="settings">
    <h2>Instellingen</h2>
    <label for="vaultPath">Map in je privé-OneDrive</label>
    <input id="vaultPath" autocomplete="off" spellcheck="false">
    <div class="hint">Pad vanaf de hoofdmap van OneDrive naar de Inbox van je vault.</div>

    <label for="workEmail">Werk-mailadres</label>
    <input id="workEmail" type="email" autocomplete="off" placeholder="naam@werk.nl">
    <div class="hint">Notities voor Werk worden hierheen gemaild met [brain] in het onderwerp.</div>

    <label for="lang">Spraaktaal</label>
    <select id="lang">
      <option value="nl-NL">Nederlands</option>
      <option value="en-US">Engels</option>
    </select>

    <div id="account"></div>
    <div class="row">
      <button id="cancelSettings">Annuleren</button>
      <button id="saveSettings" class="primary">Opslaan</button>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
